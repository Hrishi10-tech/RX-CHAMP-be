
services:
  # Optional local database, for development without RDS. Behind a profile so
  # it does NOT start by default — production uses the managed RDS instance
  # named in DATABASE_URL. Start it explicitly with:
  #   docker compose --profile local-db up
  postgres:
    profiles: ['local-db']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Not published to the host: Postgres is reachable only over the compose
    # network, by service name. Use `docker compose exec postgres psql` or an
    # SSH tunnel for admin access.
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    # required:false means "wait for postgres only if it's actually running" —
    # so the local-db profile still gets an ordered start, while the default
    # (RDS) path doesn't block on a service that never starts.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      NODE_ENV: production
      # Hours and days are read from the system clock — the activity timeline,
      # the day a sample belongs to, presence history, analytics and screenshot
      # folders all depend on it. Kept the same as ecosystem.config.js so a
      # container and a PM2 process never disagree about what day it is.
      TZ: Asia/Kolkata
      PORT: 4000
      API_PREFIX: api/v1
      # Comma-separated exact origins. A wildcard is invalid alongside
      # credentialed CORS, and the app splits this on ',' into an allow-list,
      # so '*' would never match a real origin anyway.
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      # Passed through verbatim so the RDS host, ?schema= and ?sslmode=require
      # survive. Do NOT rebuild this from POSTGRES_* — that silently repoints
      # the backend at the bundled container DB. To use the local-db profile
      # instead, set DATABASE_URL to point at host `postgres`.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      BCRYPT_SALT_ROUNDS: '12'
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?set DEFAULT_USER_PASSWORD in .env}
      LOG_LEVEL: info
      # Baked into every downloaded agent installer — must be the public
      # https URL, not an IP, or redistributed agents break when it changes.
      AGENT_PUBLIC_API_BASE_URL: ${AGENT_PUBLIC_API_BASE_URL:?set AGENT_PUBLIC_API_BASE_URL in .env}
      AGENT_S3_KEY: ${AGENT_S3_KEY:-}
      AGENT_S3_BUCKET: ${AGENT_S3_BUCKET:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_PREFIX: ${AWS_PREFIX:-uploads/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # RX Vision 3.0. Compose passes only what is listed here, so every setting
      # the app reads must appear in this list to reach the container.
      # Business time zone: break windows, day keys and the approvals digest.
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # Signs installer tokens and setup codes. Set it explicitly (different from
      # the access secret); when empty it is derived from JWT_REFRESH_SECRET.
      JWT_ENROLL_SECRET: ${JWT_ENROLL_SECRET:-}
      JWT_ENROLL_TTL: ${JWT_ENROLL_TTL:-365d}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # Daily reminder to approvers about breaks waiting for a decision.
      BREAK_DIGEST_CRON: ${BREAK_DIGEST_CRON:-30 18 * * *}
      # RX Vision 3.1: the portal address the agent opens for "Open approvals".
      # Empty: the first CORS_ORIGINS entry is used.
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-}
      AGENT_VERSION: ${AGENT_VERSION:-2.0.0}
      AGENT_FILE_NAME: ${AGENT_FILE_NAME:-RXVision.exe}
      # macOS agents (Apple Silicon and Intel), served from S3 like Windows.
      AGENT_MAC_S3_KEY: ${AGENT_MAC_S3_KEY:-}
      AGENT_MAC_FILE_NAME: ${AGENT_MAC_FILE_NAME:-RXVision-mac.zip}
      AGENT_MAC_VERSION: ${AGENT_MAC_VERSION:-}
      AGENT_MAC_X64_S3_KEY: ${AGENT_MAC_X64_S3_KEY:-}
      AGENT_MAC_X64_FILE_NAME: ${AGENT_MAC_X64_FILE_NAME:-RXVision-mac-intel.zip}
      AGENT_MAC_X64_VERSION: ${AGENT_MAC_X64_VERSION:-}
    # Not published to the host: nginx is the only public entry point.
    expose:
      - '4000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment together with the 443 block in nginx.conf.
      # - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pgdata:
