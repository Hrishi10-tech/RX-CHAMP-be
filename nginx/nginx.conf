# Reverse proxy in front of the Node backend. Terminates client connections,
# adds basic hardening, and forwards to the backend service. Put TLS here in
# production (mount certs + enable the 443 server block at the bottom).
upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

# Light rate-limit zone at the edge (defense in depth; app also rate-limits).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Socket.IO upgrades need `Connection: upgrade` on the hop to the backend, but
# plain HTTP keepalive to an upstream pool needs `Connection: ""`. This map
# picks the right value per request instead of hard-coding one of them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # Allow base64 screenshots in JSON (matches the demo's 12mb body limit).
    client_max_body_size 12m;

    # Don't leak the nginx version.
    server_tokens off;

    location /health {
        proxy_pass http://backend_upstream;
    }

    # All five gateways (/activity, /chat, /notifications, /presence,
    # /screenshots) are Socket.IO *namespaces*, so they share this one engine
    # path. No rate limit here: a long-lived socket is a single request, and
    # the burst of reconnects after a backend restart would trip the zone.
    location /socket.io/ {
        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Idle sockets must outlive Socket.IO's ping interval or nginx closes
        # them mid-session and clients reconnect in a loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- TLS -------------------------------------------------------------------
