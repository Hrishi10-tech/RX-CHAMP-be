# Host nginx site for the PM2 deployment (NOT the Docker one).
# Deploy to: /etc/nginx/sites-available/rxchamp  +  symlink into sites-enabled/
#
# Differs from nginx/nginx.conf (the containerised variant) only in the
# upstream: PM2 runs the app directly on the host, so it is 127.0.0.1:4000
# rather than the compose service name `backend`.
#
# certbot --nginx rewrites this file in place to add the 443 server block and
# the http->https redirect. Run it AFTER installing this file (see DEPLOYMENT.md
# step 8); do not hand-write the TLS block.

upstream rxchamp_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Light rate-limit zone at the edge (defense in depth; app also rate-limits).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Socket.IO upgrades need `Connection: upgrade` on the hop upstream, but plain
# HTTP keepalive needs `Connection: ""`. Pick per request instead of hard-coding.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name api.rxvision.shop;

    # Allow base64 screenshots in JSON (matches the app's 12mb body limit).
    client_max_body_size 12m;
    server_tokens off;

    location /health {
        proxy_pass http://rxchamp_api;
        access_log off;
    }

    # All five gateways are Socket.IO *namespaces* (/activity, /chat,
    # /notifications, /presence, /screenshots), so they share this one engine
    # path. No rate limit here: a long-lived socket is a single request, and
    # the reconnect burst after an app restart would trip the zone.
    location /socket.io/ {
        proxy_pass http://rxchamp_api;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Must outlive Socket.IO's ping interval or nginx closes idle sockets
        # mid-session and clients reconnect in a loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The agent installer is a ~tens-of-MB .exe streamed from S3 through the
    # app. Buffering it to disk first adds latency and fills /var/lib/nginx.
    location /api/v1/agent/download {
        proxy_pass http://rxchamp_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://rxchamp_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
