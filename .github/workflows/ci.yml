name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timechamp
          POSTGRES_PASSWORD: timechamp
          POSTGRES_DB: timechamp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U timechamp"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://timechamp:timechamp@localhost:5432/timechamp_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Migrate + seed test DB
        run: npx prisma migrate deploy && npm run db:seed
      - run: npm run test:e2e
