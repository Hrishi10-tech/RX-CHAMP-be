# Ready-to-adapt GitHub Actions workflow for building + publishing the Windows
# agent to S3. NOT active here: `.github/` is untracked in this repo (CI lives in
# the parent monorepo). Copy this into that monorepo's `.github/workflows/`,
# adjust `working-directory` to the backend path, and set the AWS_* secrets.
#
# It runs on a version tag (e.g. `agent-v3.0.0`, which must match <Version> in
# agent/Directory.Build.props; the script refuses a mismatch) and uploads to both
# the versioned key and the stable `agent/RXChampAgent.exe`. The macOS zips are
# built and uploaded by agent/build/build-mac.sh + publish-mac.sh (Linux or macOS).

name: Publish agent

on:
  push:
    tags:
      - 'agent-v*'

jobs:
  publish-agent:
    runs-on: windows-latest # publish-agent.ps1 is PowerShell (build-windows.sh is the Linux equivalent)
    defaults:
      run:
        working-directory: backend # adjust to the backend path in the monorepo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag
        shell: bash
        run: echo "AGENT_VERSION=${GITHUB_REF_NAME#agent-v}" >> "$GITHUB_ENV"

      - name: Build + upload agent
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
        run: >
          ./scripts/publish-agent.ps1 -Version "$env:AGENT_VERSION"
          -Bucket rx-timechamp -Region ap-south-1
