# Deploys the backend to the Lightsail instance (PM2, /opt/rxchamp).
#
# If the Lightsail firewall limits SSH to certain IPs, the deploy job opens
# port 22 to this runner's IP for the length of the job and restores the
# original port-22 rule afterwards, whether the deploy passed or failed. If
# port 22 is already open to all IPv4 addresses, the firewall is left alone.
#
# Needs, on the "production" environment:
#   secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (Lightsail Open/Close/
#              GetInstancePortStates only), LIGHTSAIL_SSH_KEY, LIGHTSAIL_KNOWN_HOSTS,
#              LIGHTSAIL_INSTANCE, LIGHTSAIL_HOST, LIGHTSAIL_USER, HEALTHCHECK_URL
name: Deploy to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      INSTANCE: ${{ secrets.LIGHTSAIL_INSTANCE }}
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      SSH_USER: ${{ secrets.LIGHTSAIL_USER }}
    steps:
      - name: Check required secrets are set
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          LIGHTSAIL_INSTANCE: ${{ secrets.LIGHTSAIL_INSTANCE }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY LIGHTSAIL_SSH_KEY \
                      LIGHTSAIL_KNOWN_HOSTS LIGHTSAIL_INSTANCE LIGHTSAIL_HOST \
                      LIGHTSAIL_USER HEALTHCHECK_URL; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is missing or empty"; missing=1; fi
          done
          exit $missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Save current port-22 firewall rule
        id: fw
        run: |
          aws lightsail get-instance-port-states --instance-name "$INSTANCE" \
            --query 'portStates[?fromPort==`22` && toPort==`22`]' --output json \
            > "$RUNNER_TEMP/port22-original.json"
          echo "Port 22 before deploy:"
          cat "$RUNNER_TEMP/port22-original.json"

      - name: Open port 22 to this runner
        id: ip
        run: |
          # Lightsail refuses to add an IP to a rule that already allows
          # 0.0.0.0/0, and there is nothing to open in that case anyway.
          if jq -e 'any(.[]; (.cidrs // []) | index("0.0.0.0/0") != null)' \
               "$RUNNER_TEMP/port22-original.json" > /dev/null; then
            echo "Port 22 is already open to all IPv4 addresses; firewall left unchanged."
            exit 0
          fi

          IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws lightsail open-instance-public-ports --instance-name "$INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=TCP,cidrs=$IP/32"
          # The firewall change takes a few seconds to apply.
          sleep 10

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key

          # Keep only the "<key type> <key>" pairs from the secret and file them
          # under a fixed alias, so a host-name mismatch or lines joined when the
          # secret was pasted can't break the check. The key itself is still verified.
          printf '%s\n' "$KNOWN_HOSTS" \
            | grep -oE '(ssh-ed25519|ecdsa-sha2-nistp[0-9]+|ssh-rsa) [A-Za-z0-9+/=]+' \
            | sed 's/^/lightsail /' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          echo "Host keys loaded from LIGHTSAIL_KNOWN_HOSTS:"
          awk '{ print "  " $2 }' ~/.ssh/known_hosts
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::LIGHTSAIL_KNOWN_HOSTS contains no host keys"
            exit 1
          fi

      - name: Deploy on the server
        run: |
          # Tolerate stray spaces/newlines or a "user@" prefix in the secrets.
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]'); HOST=${HOST#*@}
          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          ssh -i ~/.ssh/deploy_key \
            -o HostKeyAlias=lightsail \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/rxchamp
          git pull --ff-only origin main
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          pm2 restart all
          echo "Deployed commit:"
          git log -1 --oneline
          EOF

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$HEALTHCHECK_URL"
          echo

      - name: Close port 22 and restore the original rule
        # Only when the runner's IP was (or may have been) added to the rule.
        if: always() && steps.ip.outputs.ip != ''
        env:
          IP: ${{ steps.ip.outputs.ip }}
        run: |
          aws lightsail close-instance-public-ports --instance-name "$INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=TCP,cidrs=$IP/32" || true

          # Re-apply the saved port-22 rule (office IP), so it survives however
          # Lightsail merged or replaced the rule when the runner IP was added.
          # Aliases can't be sent together with 0.0.0.0/0, so they are dropped then.
          jq -c '.[] | {fromPort, toPort, protocol, cidrs, ipv6Cidrs, cidrListAliases}
                 | if ((.cidrs // []) | index("0.0.0.0/0")) != null then del(.cidrListAliases) else . end
                 | with_entries(select(.value != null and .value != []))' \
            "$RUNNER_TEMP/port22-original.json" |
          while read -r rule; do
            aws lightsail open-instance-public-ports --instance-name "$INSTANCE" \
              --port-info "$rule"
          done

          echo "Port 22 after deploy:"
          aws lightsail get-instance-port-states --instance-name "$INSTANCE" \
            --query 'portStates[?fromPort==`22` && toPort==`22`]' --output json

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
