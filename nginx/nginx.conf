# Reverse proxy in front of the Node backend. Terminates client connections,
# adds basic hardening, and forwards to the backend service. Put TLS here in
# production (mount certs + a 443 server block).
upstream backend_upstream {
    server backend:4000;
    keepalive 32;
}

# Light rate-limit zone at the edge (defense in depth; app also rate-limits).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Allow base64 screenshots in JSON (matches the demo's 12mb body limit).
    client_max_body_size 12m;

    # Don't leak the nginx version.
    server_tokens off;

    location /health {
        proxy_pass http://backend_upstream;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http
        
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
